<title>DeepSeek</title>
<script>
/* 首帧底色：必须在 styles.css **之前**定住主题。
   以前这里是 <html data-theme="light"> 写死的，深色用户从桌面回到应用（渲染进程被回收、
   页面重载）会先画出一帧浅色底、再被 JS 切成深色 —— 就是那一下「闪白」。
   读的是 app 用的同一个键 dsh.theme；没手动选过时退回原生壳传的 ?theme=。
   脚本失败（localStorage 被禁）也不会出错：此时无 data-theme，CSS 默认浅色。 */
(function () {
  var t = "";
  try { t = localStorage.getItem("dsh.theme") || ""; } catch (e) {}
  if (!t) {
    try { t = new URLSearchParams(location.search).get("theme") || ""; } catch (e) {}
  }
  var dark = t === "dark";
  var d = document.documentElement;
  d.dataset.theme = dark ? "dark" : "light";
  d.style.backgroundColor = dark ? "#000000" : "#f2f2f7";   // 内联：不等 CSS 加载
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute("content", dark ? "#000000" : "#F2F2F7");
})();
</script>

<div class="stage">
  <div class="device" id="device">

    <main id="app">

      <!-- ============ 会话列表 ============ -->
      <section class="screen is-active pre-boot" id="screen-sessions" data-screen="sessions">
        <header class="nav-large">
          <div class="nav-large-row">
            <div>
              <h1 class="nav-title">会话</h1>
            </div>
            <button class="icon-btn glass-btn" id="btnNewSession" aria-label="新建会话">
              <svg class="ico"><use href="#i-plus"/></svg>
            </button>
          </div>
          <div class="search-field">
            <svg class="ico sm"><use href="#i-search"/></svg>
            <input id="searchSessions" type="search" placeholder="搜索会话、文件、命令" autocomplete="off" />
          </div>
        </header>
        <div class="scroll-area" id="sessionsScroll">

          <!-- 置顶 / 工作区 是「有数据才存在」的分组：默认不占位，
               由 renderSessions() 按实际条数显示，否则冷启动首帧会闪一下空标题 -->
          <div id="pinnedSection" style="display:none">
            <div class="section-head">
              <span>置顶</span>
            </div>
            <div class="list" id="pinnedList"></div>
          </div>

          <div id="recentSection">
            <div class="section-head">
              <span>最近</span>
              <span class="head-hint">最近 3 条</span>
            </div>
            <div class="list" id="recentList"></div>
          </div>

          <div id="pcSection" style="display:none">
            <div class="section-head">
              <span>电脑</span>
              <button class="text-btn" id="btnPcRefresh">刷新</button>
            </div>
            <div class="list ws-list" id="pcList"></div>
          </div>

          <div id="wsSection" style="display:none">
            <div class="section-head">
              <span>工作区</span>
              <button class="text-btn" id="btnSelectAll">选择</button>
            </div>
            <div class="list ws-list" id="wsList"></div>
          </div>
          <div class="list-foot">端到端加密 · 会话保存在你的设备上</div>
        </div>
      </section>

      <!-- ============ 对话 ============ -->
      <section class="screen screen-chat" id="screen-chat" data-screen="chat">
        <header class="nav-compact">
          <button class="icon-btn glass-btn" id="btnBack" aria-label="返回">
            <svg class="ico"><use href="#i-back"/></svg>
          </button>
          <div class="nav-compact-title">
            <span id="chatTitle">新会话</span>
            <small id="chatSub">本地</small>
          </div>
          <button class="icon-btn glass-btn team-btn" id="btnTeam" aria-label="团队">
            <svg class="ico"><use href="#i-agent"/></svg>
            <span class="team-badge" id="teamBadge" hidden>0</span>
          </button>
          <button class="icon-btn glass-btn" id="btnChatMore" aria-label="更多">
            <svg class="ico"><use href="#i-more"/></svg>
          </button>
        </header>
        <!-- 成员会话导航条：从团队面板进入某个 teammate 的会话时显示（桌面「点成员打开它的会话」） -->
        <div class="team-view-bar" id="teamViewBar" hidden>
          <span id="teamViewLabel"></span>
          <button id="teamViewExit">退出</button>
        </div>
        <div class="chat-scroll is-at-top" id="chatScroll">
          <div id="messages" class="messages"></div>
          <div class="chat-bottom-pad"></div>
        </div>

        <!-- 回到底部（对齐桌面 ChatView.toBottom）：脱离尾部才浮出，来新消息时带一个点 -->
        <button class="to-bottom" id="toBottom" hidden aria-label="回到底部">
          <i class="tb-dot"></i><i class="tb-dot"></i><i class="tb-dot"></i>
        </button>
        <!-- 对话内搜索：从「更多」进入，复用底部输入框本体（旧版标题栏下的浮动条已删） -->

        <div class="composer-dock" id="composerDock">
        <div class="mode-bar" id="modeBar" aria-live="polite"></div>
        <!-- 发送队列：本轮还在跑时用户继续发的话排在这里，可插话 / 编辑 / 删除 -->
        <div class="queue-bar" id="queueBar" hidden></div>
        <!-- Mission 进行中带：安静的一行，不抢正文，也不做成第二个导航 -->
        <button class="mission-strip" id="missionStrip" hidden aria-label="进行中的任务">
          <span class="mc-plush mc-plush-mini">
            <img class="mc-plush-light" src="whale-plush-light.png" alt="">
            <img class="mc-plush-dark" src="whale-plush-dark.png" alt="">
          </span>
          <span class="ms-text" id="missionStripText"></span>
          <svg class="ico xs ms-chev"><use href="#i-chevron"/></svg>
        </button>
        <div class="attach-tray" id="attachTray"></div>
        <input type="file" id="fileInput" multiple accept="image/*,.svg,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.md,.markdown,.txt,.json,.csv,.tsv,.html,.htm,.kt,.java,.js,.ts,.tsx,.jsx,.py,.go,.rs,.c,.cc,.cpp,.h,.swift,.rb,.php,.cs,.sh,.sql,.yaml,.yml,.toml,.xml,.css,.log" style="display:none" />
        <input type="file" id="pcImageInput" multiple accept="image/*" style="display:none" />
        <div class="composer">
            <button class="round-btn" id="btnAttach" aria-label="添加附件">
              <svg class="ico"><use href="#i-plus"/></svg>
            </button>
            <textarea id="input" rows="1" placeholder="发消息给 Agent…" enterkeyhint="send"></textarea>
            <button class="round-btn ghost" id="btnMic" aria-label="语音" hidden>
              <svg class="ico"><use href="#i-mic"/></svg>
            </button>
            <button class="pc-context" id="pcContext" aria-label="上下文占用" hidden>
              <svg class="pc-ctx-ring" viewBox="0 0 14 14" aria-hidden="true">
                <circle class="pc-ctx-track" cx="7" cy="7" r="5.5"/>
                <circle class="pc-ctx-arc" cx="7" cy="7" r="5.5"/>
              </svg>
              <span id="pcContextPct">0%</span>
            </button>
            <button class="pc-model-chip" id="btnPcModel" aria-label="电脑上的模型" hidden></button>
            <button class="send-btn" id="btnSend" aria-label="发送" disabled>
              <svg class="ico"><use href="#i-send"/></svg>
            </button>
          </div>
        </div>
      </section>

      <!-- ============ 任务 ============ -->
      <section class="screen" id="screen-jobs" data-screen="jobs">
        <header class="nav-large">
          <div class="nav-large-row">
            <div>
              <h1 class="nav-title">任务</h1>
            </div>
            <button class="icon-btn glass-btn" id="btnNewJob" aria-label="新建任务">
              <svg class="ico"><use href="#i-plus"/></svg>
            </button>
          </div>
        </header>
        <div class="scroll-area">
          <div class="job-filters">
            <div class="segmented job-state-seg" id="jobStateSeg" role="group" aria-label="按状态筛选">
              <button type="button" data-job-state="all" class="is-on">全部</button>
              <button type="button" data-job-state="running">进行中</button>
              <button type="button" data-job-state="waiting">等待</button>
              <button type="button" data-job-state="done">已结束</button>
            </div>
            <div class="job-source-row" id="jobSourceRow" role="group" aria-label="按来源筛选">
              <button type="button" class="ctx-chip" data-job-source="all" aria-pressed="true">全部来源</button>
              <button type="button" class="ctx-chip" data-job-source="job" aria-pressed="false">后台</button>
              <button type="button" class="ctx-chip" data-job-source="schedule" aria-pressed="false">定时</button>
              <button type="button" class="ctx-chip" data-job-source="team" aria-pressed="false">团队</button>
              <button type="button" class="ctx-chip" data-job-source="local" aria-pressed="false">本地记录</button>
            </div>
          </div>
          <div class="empty-state" id="jobsEmpty">
            <svg class="ico"><use href="#i-tasks"/></svg>
            <b id="jobsEmptyTitle">还没有任务</b>
            <span id="jobsEmptySub">连接后显示 Agent 任务</span>
            <button class="btn-ghost" id="emptyConnectJobs">连接宿主机</button>
          </div>
          <div class="list" id="jobsToday" style="display:none"></div>
        </div>
      </section>

      <!-- ============ 文件 ============ -->
      <section class="screen" id="screen-files" data-screen="files">
        <header class="nav-large">
          <div class="nav-large-row">
            <div>
              <h1 class="nav-title">文件</h1>
            </div>
            <button class="icon-btn glass-btn" id="btnSearchFiles" aria-label="搜索文件">
              <svg class="ico"><use href="#i-search"/></svg>
            </button>
          </div>
        </header>
        <div class="scroll-area">
          <div class="files-search" id="filesSearchWrap">
            <svg class="ico"><use href="#i-search"/></svg>
            <input id="filesSearch" placeholder="搜索文件名" autocapitalize="off" />
          </div>
          <div class="segmented">
            <button class="seg is-on" data-file-tab="out">产出</button>
            <button class="seg" data-file-tab="work">工作区</button>
            <button class="seg" data-file-tab="att">附件</button>
          </div>
          <!-- 工作区路径：进入多深的目录都能一级一级点回去 -->
          <div class="crumb-bar" id="filesCrumb" style="display:none"></div>
          <div class="list" id="filesList" style="display:none"></div>
          <div class="empty-state" id="filesEmpty">
            <svg class="ico"><use href="#i-files"/></svg>
            <b id="filesEmptyTitle">暂无产出文件</b>
            <span id="filesEmptySub">连接后显示 Agent 产出</span>
            <button class="btn-ghost" id="emptyConnectFiles">连接宿主机</button>
          </div>
          </div>
      </section>

      <!-- ============ 设置 ============ -->
      <section class="screen" id="screen-settings" data-screen="settings">
        <header class="nav-large">
          <div class="nav-large-row">
            <div>
              <h1 class="nav-title">设置</h1>
            </div>
          </div>
        </header>
        <div class="scroll-area">
          <div class="profile-card glass" id="accountCard" role="button" tabindex="0">
            <div class="avatar">DS</div>
            <div class="profile-meta">
              <b id="accName">未登录</b>
              <span id="accSub">登录后使用 DeepSeek 模型与额度</span>
            </div>
            <button class="pro-chip" id="accAction">登录</button>
          </div>

          <div class="group-title">上下文与输出</div>
          <div class="group">
            <button class="row" id="rowContext">
              <span class="row-ico blue"><svg class="ico"><use href="#i-layers"/></svg></span>
              <span class="row-label">上下文窗口</span>
              <span class="row-value" id="ctxValue">128k</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
            <button class="row" id="rowMaxOut">
              <span class="row-ico teal"><svg class="ico"><use href="#i-file"/></svg></span>
              <span class="row-label">最大输出</span>
              <span class="row-value" id="outValue">8k</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
            <button class="row" id="rowCompact">
              <span class="row-ico orange"><svg class="ico"><use href="#i-compress"/></svg></span>
              <span class="row-label">上下文压缩</span>
              <span class="row-value" id="compValue">自动 · 90%</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
          </div>

          <div class="group-title">记忆</div>
          <div class="group">
            <div class="row">
              <span class="row-ico blue"><svg class="ico"><use href="#i-chat"/></svg></span>
              <span class="row-label">会话记忆</span>
              <label class="switch"><input type="checkbox" id="swSessMem" checked /><i></i></label>
            </div>
            <div class="row">
              <span class="row-ico purple"><svg class="ico"><use href="#i-bookmark"/></svg></span>
              <span class="row-label">全局记忆</span>
              <label class="switch"><input type="checkbox" id="swGlobalMem" checked /><i></i></label>
            </div>
            <button class="row" id="rowGlobalMems">
              <span class="row-ico graphite"><svg class="ico"><use href="#i-bookmark"/></svg></span>
              <span class="row-label">全局记忆条目</span>
              <span class="row-value" id="globalMemValue">0 条</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
            <button class="row" id="rowPersona">
              <span class="row-ico pink"><svg class="ico"><use href="#i-user"/></svg></span>
              <span class="row-label">角色设定</span>
              <span class="row-value" id="personaValue">默认</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
          </div>

          <div class="group-title">相处</div>
          <div class="group">
            <button class="row" id="rowCompanion">
              <span class="row-ico pink"><svg class="ico"><use href="#i-smile"/></svg></span>
              <span class="row-label">陪伴式畅聊</span>
              <span class="row-value" id="companionValue">未开启</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
          </div>

          <div class="group-title">通用</div>
          <div class="group">
            <button class="row" id="rowLanguage">
              <span class="row-ico blue"><svg class="ico"><use href="#i-globe"/></svg></span>
              <span class="row-label">语言</span>
              <span class="row-value" id="langValue">简体中文</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
            <button class="row" id="rowPermission">
              <span class="row-ico graphite"><svg class="ico"><use href="#i-shield"/></svg></span>
              <span class="row-label">权限</span>
              <span class="row-value" id="permValue">麦克风未授权</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
          </div>

          <div class="group-title">联网搜索</div>
          <div class="group">
            <div class="row">
              <span class="row-ico teal"><svg class="ico"><use href="#i-search"/></svg></span>
              <span class="row-label">联网搜索</span>
              <label class="switch"><input type="checkbox" id="swSearch" /><i></i></label>
            </div>
            <button class="row" id="rowSearchCfg">
              <span class="row-ico blue"><svg class="ico"><use href="#i-edit"/></svg></span>
              <span class="row-label">搜索接口</span>
              <span class="row-value" id="searchCfgValue">未配置</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
          </div>

          <div class="group-title">运行</div>
          <div class="group">
            <button class="row" id="rowMode">
              <span class="row-ico green"><svg class="ico"><use href="#i-cpu"/></svg></span>
              <span class="row-label">运行方式</span>
              <span class="row-value" id="modeValue">本地独立</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
            <button class="row" id="rowPresetDefault">
              <span class="row-ico purple"><svg class="ico"><use href="#i-agent"/></svg></span>
              <span class="row-label">新对话默认档位</span>
              <span class="row-value" id="presetValue">标准模式</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
            <button class="row" id="rowHost">
              <span class="row-ico blue"><svg class="ico"><use href="#i-link"/></svg></span>
              <span class="row-label">连接电脑</span>
              <span class="row-value" id="hostValue">未连接</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
            <button class="row" id="rowWorkspace">
              <span class="row-ico indigo"><svg class="ico"><use href="#i-branch"/></svg></span>
              <span class="row-label">默认工作区</span>
              <span class="row-value" id="wsValue">harness</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
            <button class="row" id="rowStorage">
              <span class="row-ico teal"><svg class="ico"><use href="#i-disk"/></svg></span>
              <span class="row-label">存储与落点</span>
              <span class="row-value" id="storageValue">工作区与本地数据</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
            <button class="row" id="rowPlugins">
              <span class="row-ico teal"><svg class="ico"><use href="#i-layers"/></svg></span>
              <span class="row-label">内核插件</span>
              <span class="row-value" id="pluginValue">—</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
            <button class="row" id="rowNotify">
              <span class="row-ico orange"><svg class="ico"><use href="#i-bell"/></svg></span>
              <span class="row-label">运行通知</span>
              <span class="row-value" id="notifyValue">—</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
          </div>

          <div class="group-title">模型</div>
          <div class="group">
            <button class="row" id="rowModels">
              <span class="row-ico indigo"><svg class="ico"><use href="#i-sparkle"/></svg></span>
              <span class="row-label">默认模型</span>
              <span class="row-value" id="modelValue">V4.1-Flash</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
            <button class="row" id="rowAddModel">
              <span class="row-ico teal"><svg class="ico"><use href="#i-plus"/></svg></span>
              <span class="row-label">添加自定义模型</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
            <button class="row" id="rowUsage">
              <span class="row-ico orange"><svg class="ico"><use href="#i-level"/></svg></span>
              <span class="row-label">额度与用量</span>
              <span class="row-value" id="usageValue">—</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
          </div>

          <div class="group-title">外观</div>
          <div class="group">
            <div class="row">
              <span class="row-ico graphite"><svg class="ico"><use href="#i-moon"/></svg></span>
              <span class="row-label">深色模式</span>
              <label class="switch"><input type="checkbox" id="swDark" /><i></i></label>
            </div>
          </div>

          <div class="group-title">生成模型</div>
          <div class="group">
            <button class="row" id="rowGenModels">
              <span class="row-ico purple"><svg class="ico"><use href="#i-play"/></svg></span>
              <span class="row-label">模型配置</span>
              <span class="row-value" id="genValue">未配置</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
          </div>

          <div class="group-title">Agent 权限</div>
          <div class="group">
            <div class="row" id="rowPerm">
              <span class="row-ico orange"><svg class="ico"><use href="#i-lock"/></svg></span>
              <span class="row-label">权限模式</span>
              <span class="row-value" id="permModeValue">默认权限</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </div>
          </div>

          <div class="group-title">Agent</div>
          <div class="group">
            <button class="row" id="rowIsland">
              <span class="row-ico blue"><svg class="ico"><use href="#i-glass"/></svg></span>
              <span class="row-label">灵动岛</span>
              <span class="row-value" id="islandValue">默认</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
            <div class="row">
              <span class="row-ico orange"><svg class="ico"><use href="#i-eye"/></svg></span>
              <span class="row-label">危险操作前询问</span>
              <label class="switch"><input type="checkbox" id="swAskDanger" checked /><i></i></label>
            </div>
            <div class="row">
              <span class="row-ico green"><svg class="ico"><use href="#i-check"/></svg></span>
              <span class="row-label">完成后通知</span>
              <label class="switch"><input type="checkbox" id="swNotifyDone" checked /><i></i></label>
            </div>
            <button class="row" id="rowTeam">
              <span class="row-ico purple"><svg class="ico"><use href="#i-agent"/></svg></span>
              <span class="row-label">智能体团队</span>
              <span class="row-value" id="teamLimitsValue">—</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
            <button class="row" id="rowPrompt">
              <span class="row-ico purple"><svg class="ico"><use href="#i-file"/></svg></span>
              <span class="row-label">查看用户提示词</span>
              <span class="row-value" id="promptValue">—</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
            <button class="row" id="rowUpdate">
              <span class="row-ico blue"><svg class="ico"><use href="#i-refresh"/></svg></span>
              <span class="row-label">检查更新</span>
              <span class="row-value" id="updateValue">—</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
            <button class="row" id="rowSelfModify">
              <span class="row-ico purple"><svg class="ico"><use href="#i-file"/></svg></span>
              <span class="row-label">前端自改</span>
              <span class="row-value" id="selfModifyValue">关闭</span>
              <svg class="ico chev"><use href="#i-chevron"/></svg>
            </button>
          </div>

          <div class="version">DeepSeek</div>
        </div>
      </section>
    </main>

    <!-- ============ 玻璃 Tabbar ============ -->
    <nav class="tabbar" id="tabbar" aria-label="主导航">
      <span class="tab-indicator" id="tabIndicator" aria-hidden="true"></span>
      <button class="tab is-on" data-tab="sessions">
        <svg class="ico"><use href="#i-chat"/></svg><span>会话</span>
      </button>
      <button class="tab" data-tab="jobs">
        <svg class="ico"><use href="#i-tasks"/></svg><span>任务</span>
      </button>
      <button class="tab" data-tab="files">
        <svg class="ico"><use href="#i-files"/></svg><span>文件</span>
      </button>
      <button class="tab" data-tab="settings">
        <svg class="ico"><use href="#i-settings"/></svg><span>设置</span>
      </button>
    </nav>

    <!-- 语音输入浮层：自绘，不拉起系统识别弹窗 -->
    <div class="voice-veil" id="voiceVeil" aria-hidden="true">
      <div class="voice-card" id="voiceCard">
        <div class="voice-wave" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <div class="voice-live" id="voiceLive">正在聆听…</div>
        <div class="voice-tip" id="voiceTip">说完点确认</div>
        <div class="voice-acts">
          <button class="voice-btn" id="voiceCancel" aria-label="取消"><svg class="ico"><use href="#i-x"/></svg></button>
          <button class="voice-btn primary" id="voiceDone" aria-label="完成"><svg class="ico"><use href="#i-check"/></svg></button>
        </div>
      </div>
    </div>

    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grab"><i></i></div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>

    <div class="toast" id="toast" role="status"></div>
  </div>
</div>

<script src="motion.js"></script>
<script src="app.js"></script>
</body>
</html>
